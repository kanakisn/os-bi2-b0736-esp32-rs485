# Olimpia Splendid Bi2 supervisor on a Waveshare ESP32-S3-RS485-CAN.
#
# Third Waveshare board, third B0736 / fan coil (guest room). Identical
# hardware and identical component config to olimpia-s3.yaml and
# olimpia-s3-master.yaml - only the node name, the friendly name and the
# static IP differ, so the units do not collide on the network or in Home
# Assistant.
#
# IMPORTANT: this board shares NO pins with the LilyGO T-CAN485. Do not copy the
# GPIO16/17/19 "transceiver enable" switches over from a T-CAN485 config: here
# GPIO16 is CAN RX, GPIO17 is RS485 TX and GPIO19 is USB D-. Driving them as
# always-on switches kills the bus and the USB port.

esphome:
  name: olimpia-s3-guest
  # Prefixes every entity in Home Assistant so this zone is distinct from the
  # other units (which also name their entities "Fan coils", etc.).
  friendly_name: "Guest Room FCU"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  # ESP32-S3-WROOM-1 N16R8 on this board: 16 MB flash, 8 MB octal PSRAM.
  # PSRAM is deliberately not enabled - nothing here needs it.
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  # INFO for normal operation. Raise to DEBUG (and uncomment the uart debug
  # block below) only when diagnosing the wire.
  level: INFO
  # The Type-C port is wired straight to the ESP32-S3 native USB pins
  # (GPIO19 D-, GPIO20 D+). There is no USB-UART bridge chip on this board,
  # so UART0 logging would go nowhere.
  hardware_uart: USB_SERIAL_JTAG

# ---- BLE, for the Xiaomi LYWSD03MMC room sensor -------------------------
# The ESP32-S3 radio is shared between WiFi and BLE. These scan parameters are
# a ~9% duty cycle (the ESPHome default), chosen to leave the radio free: this
# node also has to answer the B0736 inside reply_timeout (500ms). If the
# "B0736 link" binary sensor starts flapping after this was added, widen
# interval before anything else.
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
    # Passive: the pvvx "Custom" advertisement carries temperature, humidity
    # and battery in its service data, so a scan request buys nothing. This
    # stops the node transmitting on BLE at all.
    #
    # To rediscover a sensor (new probe, or one whose MAC is unknown), set this
    # back to true and add an on_ble_advertise: trigger that logs - the tracker
    # logs nothing on its own, no matter the log level.
    active: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Static IP: no DHCP lease changes, no mDNS dependency.
  # Verified free on 2026-09-04 (no ARP entry, no reply to three probes).
  # .123 was skipped - something already answers there, so the DHCP pool may
  # reach that far; confirm the pool's upper bound on the router before
  # trusting any address in this range.
  # Must stay OUTSIDE the router's DHCP pool, and must NOT be 192.168.0.121 or
  # 192.168.0.122 - those belong to the other two Waveshare nodes.
  manual_ip:
    static_ip: 192.168.0.124
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    dns1: 192.168.0.1
  # IMPORTANT: use_address must be the address the board is on RIGHT NOW,
  # otherwise the OTA upload cannot find it. The very first flash is over USB,
  # so this value is irrelevant then; from the second flash on the board is at
  # static_ip and this is correct as written.
  use_address: 192.168.0.124
  # Keeps the API connection stable; the ESP32 will not sleep its radio.
  power_save_mode: none
  # Rejoin rather than sulk if the AP disappears briefly.
  reboot_timeout: 15min

api:
  # Exploration services, callable from Developer Tools -> Actions.
  services:
    - service: read_register
      variables:
        reg: int
      then:
        - lambda: id(fancoils).read_register(reg);

    - service: write_register
      variables:
        reg: int
        value: int
      then:
        - lambda: id(fancoils).write_register(reg, value);

    - service: scan_registers
      variables:
        start: int
        count: int
      then:
        - lambda: id(fancoils).scan_registers(start, count);

    - service: set_control_bit
      variables:
        bit: int
        value: bool
      then:
        - lambda: id(fancoils).set_control_bit(bit, value);

    # EXPERIMENT: write a fan-coil register by Modbus broadcast (address 0).
    # This is the only way to reach regs 101/102/103 - the B0736 does not
    # answer them on its own address, they belong to the fan coils. Reg 103 is
    # the ambient temperature the fan coil regulates on (x0.1 degC), which the
    # B1130 writes periodically in capture.log.
    #
    # Nothing replies to a broadcast, so nothing can be read back: the only
    # evidence is a change in the fan coil's behaviour.
    # Talk to a specific slave address instead of the configured one - used to
    # find whether the fan coils answer on this wire in their own right.
    - service: write_register_fc16
      variables:
        reg: int
        value: int
      then:
        - lambda: id(fancoils).write_register_fc16(reg, value);

    - service: read_register_at
      variables:
        addr: int
        reg: int
      then:
        - lambda: id(fancoils).read_register_at(addr, reg);

    - service: write_register_at
      variables:
        addr: int
        reg: int
        value: int
      then:
        - lambda: id(fancoils).write_register_at(addr, reg, value);

    - service: write_register_broadcast
      variables:
        reg: int
        value: int
      then:
        - lambda: id(fancoils).write_register_broadcast(reg, value);

ota:
  - platform: esphome

external_components:
  - source:
      type: local
      path: components

# ---- Modbus ASCII on the B0736 supervisor port (A'/B') ----
uart:
  id: bus
  tx_pin: GPIO17
  rx_pin: GPIO18
  # SP3485EN transceiver, RE/DE tied to GPIO21. Non-inverted: HIGH = drive
  # during TX, LOW = listen otherwise. Confirmed correct by the listen-only
  # sniffer (RX works with the pin idle LOW). Inverting it changed nothing.
  flow_control_pin: GPIO21
  baud_rate: 9600
  data_bits: 7
  parity: EVEN
  stop_bits: 1
  # Wire-level diagnostics. Uncomment (and set logger level: DEBUG) to hex-dump
  # every frame when debugging the bus.
  # debug:
  #   direction: BOTH
  #   after:
  #     timeout: 20ms
  #     bytes: 256

# ---- Xiaomi LYWSD03MMC room probe, over BLE -----------------------------
# MAC A4:C1:38:B1:C0:3A, hardware B1.4, flashed to pvvx v5.9 on 2026-09-16.
# It now advertises as "ATC_B1C03A" (ATC_ plus the last three bytes of the
# MAC); on stock firmware it was "LYWSD03MMC". That name is the quickest way
# to tell which firmware a unit is running without connecting to it.
#
# The sensor MUST be set to "Advertising type: PVVX (Custom)" with "Encrypted
# beacon" off. pvvx_mithermometer reads only that format - Mi-like, atc1441
# and BTHome v2 all produce silence here, which looks exactly like the sensor
# being out of range. Check the advertising type before suspecting range.
#
# Until the sensor reports, the climate entity simply keeps publishing the
# B0736's own reg 0, so this block is inert rather than harmful.
sensor:
  - platform: pvvx_mithermometer
    mac_address: "A4:C1:38:B1:C0:3A"
    temperature:
      name: "External probe temperature"
      id: guest_ble_temperature
    humidity:
      name: "External probe humidity"
    battery_level:
      name: "External probe battery"
      entity_category: diagnostic
    battery_voltage:
      name: "External probe battery voltage"
      entity_category: diagnostic

climate:
  - platform: olimpia_b0736
    name: "Fan coils"
    id: fancoils
    uart_id: bus
    address: 1
    reply_timeout: 500ms
    max_retries: 2
    update_interval: 5s

    # NOTE: external_temperature: is deliberately NOT set. The climate entity
    # reports the B0736's own reg 0, so what Home Assistant shows is what the
    # hardware is actually regulating on. The BLE probe is published on its own
    # entities instead ("External probe ..."), so the two can be compared
    # without one masquerading as the other.
    #
    # The component still supports external_temperature: - see
    # .knowledge/features/external-ble-room-probe.md. It is left unwired here.
    room_temperature:
      name: "Room temperature"
    fault:
      name: "Fan coil fault"
    chiller:
      name: "Chiller demand"
    boiler:
      name: "Boiler demand"
    online:
      name: "B0736 link"
