esphome:
  name: olimpia-sniffer

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  # DEBUG is required for the uart debug block below to print anything.
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Static IP: no DHCP lease changes, no mDNS dependency.
  # Pick an address OUTSIDE your router's DHCP pool.
  manual_ip:
    static_ip: 192.168.0.110
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    dns1: 192.168.0.1
  # IMPORTANT: use_address must be the address the board is on RIGHT NOW,
  # otherwise the OTA upload cannot find it. After the first flash with a
  # new manual_ip, change this to match static_ip.
  use_address: 192.168.0.110
  # Keeps the API connection stable; the ESP32 will not sleep its radio.
  power_save_mode: none
  # Rejoin rather than sulk if the AP disappears briefly.
  reboot_timeout: 15min

api:
  # Exploration services, callable from Developer Tools -> Actions.
  services:
    - service: read_register
      variables:
        reg: int
      then:
        - lambda: id(fancoils).read_register(reg);

    - service: write_register
      variables:
        reg: int
        value: int
      then:
        - lambda: id(fancoils).write_register(reg, value);

    - service: scan_registers
      variables:
        start: int
        count: int
      then:
        - lambda: id(fancoils).scan_registers(start, count);

    - service: set_control_bit
      variables:
        bit: int
        value: bool
      then:
        - lambda: id(fancoils).set_control_bit(bit, value);

ota:
  - platform: esphome

external_components:
  - source:
      type: local
      path: components

# ---- T-CAN485 transceiver enables: all three HIGH ----
switch:
  - platform: gpio
    id: en_5v
    pin: GPIO16
    restore_mode: ALWAYS_ON
    internal: true
  - platform: gpio
    id: rs485_en
    pin: GPIO17
    restore_mode: ALWAYS_ON
    internal: true
  - platform: gpio
    id: rs485_se
    pin: GPIO19
    restore_mode: ALWAYS_ON
    internal: true

# ---- Modbus ASCII on the B0736 supervisor port (A'/B') ----
uart:
  id: bus
  rx_pin: GPIO21
  tx_pin: GPIO22
  baud_rate: 9600
  data_bits: 7
  parity: EVEN
  stop_bits: 1
  # Wire-level diagnostics. Comment out once the link is working.
  debug:
    direction: BOTH
    after:
      timeout: 20ms
      bytes: 256

climate:
  - platform: olimpia_b0736
    name: "Fan coils"
    id: fancoils
    uart_id: bus
    address: 1
    update_interval: 5s

    room_temperature:
      name: "Room temperature"
    fault:
      name: "Fan coil fault"
    chiller:
      name: "Chiller demand"
    boiler:
      name: "Boiler demand"
    online:
      name: "B0736 link"
