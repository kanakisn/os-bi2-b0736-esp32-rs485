# Olimpia Splendid Bi2 fan coil on a Waveshare ESP32-S3-RS485-CAN,
# talking to the coil DIRECTLY - no B0736 thermostat in the path.
#
# This replaces a B1130 WiFi kit that was wired straight to the fan coil.
# It is NOT the same protocol as olimpia-s3*.yaml: those supervise a B0736
# over its A'/B' port, this one drives the coil itself. See
# .knowledge/features/b1130-direct-fancoil.md
#
# Decoded from capture-b1130.log - a live capture of the B1130 doing this job,
# with setpoint, fan speed and on/off changed in the Olimpia app to confirm
# each write. The B1130 polled address 1 every 2.82 s and wrote only on user
# action; there were no broadcasts and no IDENT handshake.
#
# THE TRAP: reg 231 is the setpoint on both this coil and a B0736, but the
# encodings differ - x0.1 degC here (220 = 22.0), (degC-15.5)*2 there
# (13 = 22.0). That is why this is a separate component and not a flag on
# olimpia_b0736.
#
# IMPORTANT: this board shares NO pins with the LilyGO T-CAN485. Do not copy
# the GPIO16/17/19 "transceiver enable" switches over from a T-CAN485 config:
# here GPIO16 is CAN RX, GPIO17 is RS485 TX and GPIO19 is USB D-. Driving them
# as always-on switches kills the bus and the USB port.

esphome:
  name: olimpia-s3-standalone
  # Prefixes every entity in Home Assistant so this zone is distinct from the
  # three B0736 units.
  friendly_name: "Basement FCU 1"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  # ESP32-S3-WROOM-1 N16R8: 16 MB flash, 8 MB octal PSRAM.
  # PSRAM is deliberately not enabled - nothing here needs it.
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  # INFO for normal operation. Raise to DEBUG (and uncomment the uart debug
  # block below) only when diagnosing the wire.
  level: INFO
  # The Type-C port is wired straight to the ESP32-S3 native USB pins
  # (GPIO19 D-, GPIO20 D+). There is no USB-UART bridge chip on this board,
  # so UART0 logging would go nowhere.
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # .121/.122/.124 are the three B0736 boards and .125 is the B1130 sniffer.
  # .126 must be VERIFIED FREE and OUTSIDE the router's DHCP pool before the
  # first flash - .123 looked silent too and turned out to be occupied:
  #     ping -c3 192.168.0.126   &&   arp -n 192.168.0.126
  manual_ip:
    static_ip: 192.168.0.126
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    dns1: 192.168.0.1
  # IMPORTANT: use_address must be the address the board is on RIGHT NOW,
  # otherwise the OTA upload cannot find it. The very first flash is over USB,
  # so this value is irrelevant then; from the second flash on the board is at
  # static_ip and this is correct as written.
  use_address: 192.168.0.126
  power_save_mode: none
  reboot_timeout: 15min

api:
  # Exploration services, callable from Developer Tools -> Actions.
  services:
    - service: read_register
      variables:
        reg: int
      then:
        - lambda: id(fancoil).read_register(reg);

    - service: write_register
      variables:
        reg: int
        value: int
      then:
        - lambda: id(fancoil).write_register(reg, value);

    - service: scan_registers
      variables:
        start: int
        count: int
      then:
        - lambda: id(fancoil).scan_registers(start, count);

ota:
  - platform: esphome

external_components:
  - source:
      type: local
      path: components

# ---- Modbus ASCII straight to the fan coil ----
# Identical wiring and framing to the B0736 boards: 9600 7E1, NOT inverted
# (inverting makes the idle line read as a stream of 0x00).
uart:
  id: bus
  tx_pin: GPIO17
  rx_pin: GPIO18
  # SP3485EN transceiver, RE/DE tied to GPIO21. The IDF driver toggles it in
  # hardware - do NOT add a GPIO switch for this pin.
  flow_control_pin: GPIO21
  baud_rate: 9600
  data_bits: 7
  parity: EVEN
  stop_bits: 1
  # Wire-level diagnostics. Uncomment (and set logger level: DEBUG) to hex-dump
  # every frame when debugging the bus.
  # debug:
  #   direction: BOTH
  #   after:
  #     timeout: 20ms
  #     bytes: 256

climate:
  - platform: olimpia_fancoil
    name: "Fan coil"
    id: fancoil
    uart_id: bus
    # The B1130 polled address 1. If this unit answers nothing, sweep with
    # read_register after checking reg 200 (the coil's own address setting).
    address: 1
    reply_timeout: 500ms
    max_retries: 2
    # The B1130 used 2.82 s. 5 s is gentler on the bus and still far faster
    # than the thermal response of a fan coil.
    update_interval: 5s

    room_temperature:
      name: "Room temperature"
    # Reg 1 is documented as water temperature in the community map but the
    # B1130 never polled it, so it is UNVERIFIED on this unit. If it reads
    # 0x7FFF or nonsense, drop this block.
    water_temperature:
      name: "Water temperature"
    ev1:
      name: "Valve EV1"
    ev2:
      name: "Valve EV2"
    online:
      name: "Fan coil link"
